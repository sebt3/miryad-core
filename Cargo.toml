[package]
name = "miryad-core"
version = "0.1.6"
edition = "2024"
description = "Moteur générique (auth OIDC, RBAC, REST/GraphQL/MCP, workflow) derrière le template d'application miryad — une ligne de trait par entité, tout le reste est fourni"
license = "BSD-3-Clause"
repository = "https://github.com/sebt3/miryad-core"
homepage = "https://github.com/sebt3/miryad-core"
documentation = "https://docs.rs/miryad-core"
readme = "README.md"
keywords = ["axum", "sea-orm", "rbac", "oidc", "crud"]
categories = ["web-programming", "authentication"]
# Les specs `.sdd` vivent à côté de leur source et ne sont pas embarquées dans le paquet publié ;
# le bootstrap SpecDD et les définitions d'agents ne regardent pas les consommateurs.
exclude = [".specdd/*", ".opencode/*", "**/*.sdd", "src/workflow/fixtures_rhai/*"]

[[bin]]
name = "miryad"
path = "src/bin/miryad.rs"

# Harnais de qualité des agents — source de vérité contractualisée par tooling.sdd.
[lints.rust]
unsafe_code = "forbid"
# deny depuis que la crate est à zéro avertissement (tâche `tooling.sdd` « Basculer
# missing_docs en deny », 2026-09-29). La bascule ne casse pas `cargo build`/`cargo test` :
# l'exemption `cfg(test)` de `src/lib.rs` et les crates de `tests/` ne documentent que des
# items privés, le lint ne vise que les items pub atteignables. Le -D warnings de la CI
# reste la seconde barrière hors harnais.
missing_docs = "deny"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
# Doublons de versions imposés par les dépendances amont (SeaORM, axum, openidconnect,
# seaography) — cargo update ne les déduplique pas. Décision Sébastien, voir tooling.sdd.
multiple_crate_versions = { level = "allow", priority = 1 }

[dependencies]
sea-orm = { version = "2", features = ["macros"] }
sea-orm-migration = "2"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
openidconnect = "4.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# Validation du contenu `ca_cert` (au moins un bloc PEM `CERTIFICATE` décodable) par l'itérateur
# PEM vendu, arbitrage `oidc.sdd` 2026-09-27 — unifiée avec le 1.15.1 déjà dans le graphe rustls.
rustls-pki-types = "1"
cookie = { version = "0.18", features = ["private"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
base64 = "0.23"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = "0.4"
utoipa = "5"
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum", "vendored"] }
seaography = { version = "2.0.0-rc.9", optional = true }
async-graphql = { version = "7", optional = true }
async-graphql-axum = { version = "7", optional = true }
vynil-core = { version = "0.7.7", default-features = false, features = ["hbs"], optional = true }
tower-http = { version = "0.6", default-features = false, features = ["fs"], optional = true }
restate-sdk = { version = "0.12", features = ["http_server"], optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }

[features]
default = ["static-frontend"]
static-frontend = ["dep:tower-http"]
swagger-ui = ["dep:utoipa-swagger-ui"]
graphql = ["dep:seaography", "dep:async-graphql", "dep:async-graphql-axum", "sea-orm/seaography"]
graphiql = ["graphql", "async-graphql/graphiql"]
mcp = ["dep:vynil-core"]
# async-trait n'est pas dans ce tableau : déjà dépendance directe non optionnelle utilisée hors
# gating (src/auth/oidc.rs, src/migration/*) ; la rendre optionnelle casserait tout build sans
# workflow — contrat tranché dans src/workflow/mod.sdd `Must` (implémentation 2026-09-23).
workflow = ["dep:restate-sdk", "dep:uuid", "dep:vynil-core", "vynil-core?/rhai", "dep:tokio"]

[dev-dependencies]
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "mock"] }
# Sonde `has_table`/`has_column` contractuelle des tests de migration — la dispatch de
# `SchemaManager` est compilée sous la feature `sqlx-sqlite` de sea-orm-migration (défaut `cli` seul
# sinon → `BackendNotSupported` à l'exécution). Graphe de test uniquement, graphe public intact.
# Ordonné par src/migration/m20260923_000001_create_workflow_definitions.sdd `Tasks` (pattern
# `SchemaManager::has_table`/`has_column`, acquis partagé avec m20260822_000001_create_api_tokens.sdd
# et m20260822_000002_create_users_groups.sdd).
sea-orm-migration = { version = "2", features = ["sqlx-sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
# Capture des `tracing::error` des chemins d'échec d'échange dans les tests de `auth/oidc.rs`
# (stratégie fixture arbitrée `[x]` 2026-09-27, `Depends on` de `oidc.sdd`).
tracing-subscriber = { version = "0.3", features = ["registry"] }

[package.metadata.docs.rs]
all-features = false
features = ["static-frontend", "swagger-ui", "graphql", "graphiql", "mcp", "workflow"]
rustdoc-args = ["--cfg", "docsrs"]
