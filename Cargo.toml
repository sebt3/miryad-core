[package]
name = "miryad-core"
version = "0.1.0"
edition = "2024"
description = "Moteur générique (auth, RBAC, REST/GraphQL/MCP, workflow) derrière le template d'application miryad"
license = "BSD-3-Clause"
repository = "https://github.com/sebt3/miryad-core"

[[bin]]
name = "miryad"
path = "src/bin/miryad.rs"

[dependencies]
sea-orm = { version = "2", features = ["macros"] }
sea-orm-migration = "2"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
openidconnect = "4.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
cookie = { version = "0.18", features = ["private"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
chrono = "0.4"
utoipa = "5"
utoipa-swagger-ui = { version = "9", optional = true, features = ["axum"] }

[features]
swagger-ui = ["dep:utoipa-swagger-ui"]

[dev-dependencies]
sea-orm = { version = "2", features = ["sqlx-sqlite", "runtime-tokio-rustls", "macros", "mock"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
