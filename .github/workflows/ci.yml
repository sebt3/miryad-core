---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: no-default
            args: "--no-default-features"
          - name: swagger-ui
            args: "--no-default-features --features swagger-ui"
          - name: graphql
            args: "--no-default-features --features graphql"
          - name: graphiql
            args: "--no-default-features --features graphiql"
          - name: mcp
            args: "--no-default-features --features mcp"
          - name: workflow
            args: "--no-default-features --features workflow"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (${{ matrix.name }})
        run: cargo test ${{ matrix.args }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pas de graphe contenant graphql ni --all-features : carve-out du pont gele
        # (./workflows.sdd, arbitre par Sebastien le 2026-10-03, option A).
        include:
          - name: no-default
            args: "--no-default-features"
          - name: default
            args: ""
          - name: swagger-ui
            args: "--no-default-features --features swagger-ui"
          - name: mcp
            args: "--no-default-features --features mcp"
          - name: workflow
            args: "--no-default-features --features workflow"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (${{ matrix.name }})
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings
