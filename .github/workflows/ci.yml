---
name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Tests (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: no-default
            args: "--no-default-features"
          - name: db
            args: "--no-default-features --features db"
          - name: swagger-ui
            args: "--no-default-features --features swagger-ui"
          - name: swagger-ui-db
            args: "--no-default-features --features swagger-ui,db"
          - name: frontend-swagger-ui
            args: "--no-default-features --features static-frontend,swagger-ui"
          - name: mcp
            args: "--no-default-features --features mcp"
          - name: workflow
            args: "--no-default-features --features workflow"
          - name: systemone
            args: "--no-default-features --features systemone"
          - name: workflow-systemone
            args: "--no-default-features --features workflow,systemone"
          - name: matrix
            args: "--no-default-features --features matrix"
          - name: workflow-matrix
            args: "--no-default-features --features workflow,matrix"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo test (${{ matrix.name }})
        run: cargo test ${{ matrix.args }}

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        run: cargo fmt -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            args: ""
          - name: no-default
            args: "--no-default-features"
          - name: db
            args: "--no-default-features --features db"
          - name: swagger-ui
            args: "--no-default-features --features swagger-ui"
          - name: swagger-ui-db
            args: "--no-default-features --features swagger-ui,db"
          - name: frontend-swagger-ui
            args: "--no-default-features --features static-frontend,swagger-ui"
          - name: mcp
            args: "--no-default-features --features mcp"
          - name: workflow
            args: "--no-default-features --features workflow"
          - name: systemone
            args: "--no-default-features --features systemone"
          - name: workflow-systemone
            args: "--no-default-features --features workflow,systemone"
          - name: matrix
            args: "--no-default-features --features matrix"
          - name: workflow-matrix
            args: "--no-default-features --features workflow,matrix"
          - name: all-features
            args: "--all-features"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo clippy (${{ matrix.name }})
        run: cargo clippy --all-targets ${{ matrix.args }} -- -D warnings

  no-db-graph:
    name: sea-orm absent sans db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo tree -i sea-orm doit être vide sans db
        shell: bash
        run: |
          for args in "--no-default-features" "--no-default-features --features swagger-ui" "--no-default-features --features static-frontend,swagger-ui"; do
            echo "cargo tree $args -e normal -i sea-orm"
            out=$(cargo tree $args -e normal -i sea-orm) ; status=$? ; if [ "$status" -ne 0 ] || [ -n "$out" ]; then echo "sea-orm est dans le graphe sans db :" ; echo "$out" ; exit 1 ; fi
          done
